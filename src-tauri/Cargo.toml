[package]
name = "vue-tauri-template"
version = "0.1.0"
description = "Vue Tauri starter"
authors = ["you"]
edition = "2021"

[lib]
name = "vue_tauri_template_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
